name: SEO Sites Generator & Deploy

on:
  schedule:
    - cron: '0 2 * * *'  # 每天凌晨 2 点重新生成
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/seo_gen.py'

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install jinja2 aiohttp

      - name: Generate SEO Sites
        env:
          MAIN_DOMAIN: ${{ secrets.MAIN_DOMAIN }}
          SITE_COUNT: ${{ secrets.SITE_COUNT || '50' }}
          PAGES_PER_SITE: ${{ secrets.PAGES_PER_SITE || '20' }}
        run: |
          cd scripts
          python seo_gen.py

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          projectName: phish-seo-${{ github.run_number }}
          directory: ../seo_sites
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload generated sites as artifact
        uses: actions/upload-artifact@v4
        with:
          name: seo-sites-${{ github.run_number }}
          path: seo_sites/
          retention-days: 7
